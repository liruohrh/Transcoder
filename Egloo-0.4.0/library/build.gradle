apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.dokka-android'
apply plugin: 'com.github.dcendents.android-maven'
// apply plugin: 'com.jfrog.bintray'

ext {
    libVersion = '0.4.0'
    libGroup = 'com.otaliastudios.opengl'
    libName = 'Egloo'
    libDescription = 'Simple and lightweight OpenGL ES drawing and EGL management for Android, with object-oriented components based on Google\'s Grafika.'
    libArtifactId = 'egloo'
    githubUrl = "https://github.com/natario1/${libName}"
    githubGit = "https://github.com/natario1/${libName}.git"
    libLicenseName = 'MIT License'
    libLicenseUrl = 'http://www.opensource.org/licenses/mit-license.php'
}

// Required by bintray
// archivesBaseName is required if artifactId is different from gradle module name
// or you can add baseName to each archive task (sources, javadoc, aar)
version = libVersion
group = libGroup
archivesBaseName = libArtifactId

android {

    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName libVersion
    }
}

dependencies {
    api "androidx.annotation:annotation:1.1.0"
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

task dokkaJar(type: Jar, dependsOn: dokka) {
    archiveClassifier.set('javadoc')
    from dokka.outputDirectory
}

artifacts {
    archives dokkaJar
    archives sourcesJar
}


install.repositories.mavenInstaller.pom.project {
    name libName
    description libDescription
    url githubUrl
    groupId libGroup
    artifactId libArtifactId
    version libVersion
    packaging 'aar'

    scm {
        connection githubGit
        url githubUrl
    }
    licenses {
        license {
            name libLicenseName
            url libLicenseUrl
        }
    }

    developers {
        developer {
            id = 'natario'
            name 'Mattia Iavarione'
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/liruohrh/Transcoder")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            pom {
                artifactId = libArtifactId
                groupId = libGroup
                version = libVersion

                name = libName
                description = libDescription
                url = githubUrl

                licenses {
                    license {
                        name = libLicenseName
                        url = libLicenseUrl
                    }
                }

                developers {
                    developer {
                        id = 'natario'
                        name = 'Mattia Iavarione'
                    }
                    developer {
                        id = 'liruohrh'
                        name = 'LiRuo'
                    }
                }

                scm {
                    connection = "scm:git:https://github.com/liruohrh/Transcoder.git"
                    developerConnection = "scm:git:ssh://git@github.com:liruohrh/Transcoder.git"
                    url = "https://github.com/liruohrh/Transcoder"
                }
            }
        }
    }
}